<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheStoryCatcher.in | Coming Soon</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0a0a0a;
            color: #f5f5f5;
        }
        .serif {
            font-family: 'Playfair Display', serif;
        }
        .lens-glow {
            box-shadow: 0 0 60px 10px rgba(59, 130, 246, 0.1);
        }
        .shutter-anim {
            animation: shutter 4s infinite ease-in-out;
        }
        @keyframes shutter {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        .grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-hidden">
    <div class="grain"></div>

    <!-- Header -->
    <header class="p-8 md:p-12">
        <div class="flex items-center gap-2">
            <div class="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></div>
            <span class="text-sm font-semibold tracking-widest uppercase text-gray-400">Under Construction</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center px-6 text-center relative">
        <!-- Lens Visual Container -->
        <div class="relative mb-12">
            <div class="absolute inset-0 bg-blue-500/10 blur-[100px] rounded-full"></div>
            
            <!-- Stylized Lens/404 Hybrid Design -->
            <div class="relative flex items-center justify-center">
                <span class="text-[120px] md:text-[200px] font-black text-white/5 select-none absolute -left-12 md:-left-24">4</span>
                
                <div class="w-48 h-48 md:w-64 md:h-64 rounded-full border-4 border-white/10 p-4 relative flex items-center justify-center lens-glow shutter-anim">
                    <!-- Lens Inner Ring -->
                    <div class="w-full h-full rounded-full border-8 border-white/20 relative overflow-hidden flex items-center justify-center bg-zinc-900">
                        <!-- Shutter Blades (Visual Simulation) -->
                        <div class="absolute inset-0 grid grid-cols-2 grid-rows-2 opacity-20">
                            <div class="border-r border-b border-white/40"></div>
                            <div class="border-l border-b border-white/40"></div>
                            <div class="border-r border-t border-white/40"></div>
                            <div class="border-l border-t border-white/40"></div>
                        </div>
                        <!-- Central Pupil -->
                        <div class="w-12 h-12 md:w-16 md:h-16 rounded-full bg-gradient-to-br from-blue-600 to-indigo-900 shadow-inner flex items-center justify-center">
                            <div class="w-3 h-3 bg-white/30 rounded-full absolute top-1/4 right-1/4"></div>
                        </div>
                    </div>
                    <!-- Lens Markings -->
                    <div class="absolute -top-6 text-[10px] tracking-[0.3em] font-bold text-gray-500 uppercase">50mm 1:1.4 D</div>
                    <div class="absolute -bottom-6 text-[10px] tracking-[0.3em] font-bold text-gray-500 uppercase">TheStoryCatcher</div>
                </div>

                <span class="text-[120px] md:text-[200px] font-black text-white/5 select-none absolute -right-12 md:-right-24">4</span>
            </div>
        </div>

        <!-- Text content -->
        <div class="max-w-2xl z-10">
            <h1 class="serif text-5xl md:text-7xl font-light mb-6">
                Something <span class="italic text-blue-400">beautiful</span> is developing.
            </h1>
            <p class="text-gray-400 text-lg md:text-xl mb-12 font-light leading-relaxed">
                TheStoryCatcher.in is currently in the darkroom. We're busy capturing the moments that matter to bring you a new perspective on storytelling.
            </p>

            <!-- Subscription Form -->
            <form onsubmit="event.preventDefault(); alert('Thank you! We will notify you when we launch.')" class="flex flex-col md:flex-row gap-3 max-w-md mx-auto">
                <input type="email" placeholder="Enter your email" required class="bg-white/5 border border-white/10 rounded-full px-6 py-3 flex-grow focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all text-white placeholder:text-gray-600">
                <button type="submit" class="bg-white text-black px-8 py-3 rounded-full font-bold hover:bg-blue-400 hover:text-white transition-all cursor-pointer whitespace-nowrap">
                    Notify Me
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="p-8 md:p-12 flex flex-col md:flex-row justify-between items-center gap-6 border-t border-white/5">
        <div class="text-gray-500 text-sm">
            &copy; 2024 TheStoryCatcher.in. All rights reserved.
        </div>
        
        <div class="flex gap-8">
            <a href="https://www.instagram.com/thestorycatcher.in/" class="text-gray-400 hover:text-white transition-colors">Instagram</a>
            <a href="7087042939" class="text-gray-400 hover:text-white transition-colors">Contact</a>
        </div>
    </footer>

    <script>
        // Optional: Simple parallax effect for the lens
        document.addEventListener('mousemove', (e) => {
            const amount = 10;
            const x = (e.clientX / window.innerWidth - 0.5) * amount;
            const y = (e.clientY / window.innerHeight - 0.5) * amount;
            const lens = document.querySelector('.shutter-anim');
            if (lens) {
                lens.style.transform = `translate(${x}px, ${y}px)`;
            }
        });
    </script>
</body>
</html>
